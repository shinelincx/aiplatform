name: ado-platform

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ado
      POSTGRES_USER: ado
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ado-local-dev}
    ports: ["127.0.0.1:${POSTGRES_PORT:-15432}:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "ado", "-d", "ado"]
      interval: 5s
      timeout: 3s
      retries: 15

  redis:
    image: redis:7-alpine
    ports: ["127.0.0.1:${REDIS_PORT:-16379}:6379"]
    volumes: [redisdata:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 15

  storage:
    image: chrislusf/seaweedfs:4.54
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:-ado-local}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:-ado-local-dev}
      S3_BUCKET: ado-dev
    ports: ["127.0.0.1:${S3_PORT:-19000}:8333"]
    volumes: [s3data:/data]
    healthcheck:
      test: ["CMD", "wget", "-qO", "/dev/null", "http://127.0.0.1:8333/readyz"]
      interval: 5s
      timeout: 3s
      retries: 20

  migrate:
    image: ado-platform-dev:local
    pull_policy: never
    command: [./node_modules/.bin/tsx, --tsconfig, apps/api/tsconfig.json, apps/api/src/migrate.ts]
    environment:
      PGHOST: postgres
      PGPORT: 5432
      PGDATABASE: ado
      PGUSER: ado
      PGPASSWORD: ${POSTGRES_PASSWORD:-ado-local-dev}
      ADO_DATABASE_PASSWORD: ${ADO_DATABASE_PASSWORD:-ado-local-api-dev}
    volumes: [./apps/api/src:/app/apps/api/src:ro]
    depends_on:
      postgres: { condition: service_healthy }

  api:
    build: .
    image: ado-platform-dev:local
    environment:
      PORT: 3101
      PGHOST: postgres
      PGPORT: 5432
      PGDATABASE: ado
      PGUSER: ado_api
      PGPASSWORD: ${ADO_DATABASE_PASSWORD:-ado-local-api-dev}
      ADO_BOOTSTRAP_EMAIL: ${ADO_BOOTSTRAP_EMAIL-}
      ADO_BOOTSTRAP_PASSWORD: ${ADO_BOOTSTRAP_PASSWORD-}
      ADO_AGENT_API_KEY: ${ADO_AGENT_API_KEY-}
      ADO_AGENT_MODEL: ${ADO_AGENT_MODEL-}
      NODE_USE_ENV_PROXY: "1"
      HTTPS_PROXY: ${ADO_API_HTTPS_PROXY-}
      NO_PROXY: localhost,127.0.0.1,postgres,redis,storage,api.github.com,github.com
      GITHUB_APP_ID: ${GITHUB_APP_ID-}
      GITHUB_APP_PRIVATE_KEY: ${GITHUB_APP_PRIVATE_KEY-}
      GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET-}
      ADO_RELEASE_GATE_SECRET: ${ADO_RELEASE_GATE_SECRET-}
      ADO_RELEASE_PROJECT_ID: ${ADO_RELEASE_PROJECT_ID-}
      ADO_STAGING_RELEASE_SECRET: ${ADO_STAGING_RELEASE_SECRET-}
      ADO_STAGING_WORKFLOW_TOKEN: ${ADO_STAGING_WORKFLOW_TOKEN-}
      ADO_S3_ENDPOINT: http://storage:8333
      ADO_S3_BUCKET: ado-dev
      ADO_S3_ACCESS_KEY: ${S3_ACCESS_KEY:-ado-local}
      ADO_S3_SECRET_KEY: ${S3_SECRET_KEY:-ado-local-dev}
    volumes: [./apps/api/src:/app/apps/api/src:ro]
    ports: ["127.0.0.1:${API_PORT:-3101}:3101"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
      storage: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3101/health').then(r => process.exit(r.ok ? 0 : 1))"]
      interval: 5s
      timeout: 4s
      retries: 20

  web:
    image: ado-platform-dev:local
    pull_policy: never
    command: npm run dev -w @ado/web
    environment:
      API_BASE_URL: http://api:3101
      ADO_SECURE_COOKIES: ${ADO_SECURE_COOKIES:-false}
    volumes: [./apps/web/app:/app/apps/web/app:ro]
    ports: ["127.0.0.1:${WEB_PORT:-3100}:3000"]
    depends_on:
      api: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000').then(r => process.exit(r.ok ? 0 : 1))"]
      interval: 10s
      timeout: 8s
      start_period: 30s
      retries: 12

volumes:
  pgdata:
  redisdata:
  s3data:
