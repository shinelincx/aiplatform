name: ado-staging

services:
  postgres:
    restart: unless-stopped

  redis:
    restart: unless-stopped

  storage:
    restart: unless-stopped

  migrate:
    image: ado-platform-staging:local
    environment:
      ADO_DATABASE_PASSWORD: ${ADO_DATABASE_PASSWORD:?Set a separate staging API database password}

  api:
    image: ado-platform-staging:local
    command: [./node_modules/.bin/tsx, --tsconfig, apps/api/tsconfig.json, apps/api/src/main.ts]
    restart: unless-stopped
    environment:
      PGPASSWORD: ${ADO_DATABASE_PASSWORD:?Set a separate staging API database password}

  web:
    image: ado-platform-staging:local
    restart: unless-stopped
    environment:
      ADO_SECURE_COOKIES: 'true'

  gateway:
    image: ${ADO_STAGING_GATEWAY_IMAGE:-nginx:1.28-alpine}
    restart: unless-stopped
    depends_on:
      api: { condition: service_healthy }
      web: { condition: service_healthy }
    ports:
      - '${ADO_STAGING_BIND:-127.0.0.1}:${ADO_STAGING_PORT:-3443}:443'
    volumes:
      - ./deploy/staging-nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ${ADO_STAGING_TLS_DIR:?Set ADO_STAGING_TLS_DIR to a directory containing tls.crt and tls.key}:/etc/ado-tls:ro
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          wget --no-check-certificate -q -O /dev/null https://127.0.0.1/health
          && wget --no-check-certificate -q -O /dev/null https://127.0.0.1/
      interval: 10s
      timeout: 5s
      retries: 10
