map $http_upgrade $ado_connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 443 ssl;
    server_name _;
    ssl_certificate /etc/ado-tls/tls.crt;
    ssl_certificate_key /etc/ado-tls/tls.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $ado_connection_upgrade;
    proxy_read_timeout 90s;

    location = /health {
        proxy_pass http://api:3101;
    }

    location = /workers/ws {
        proxy_pass http://api:3101;
    }

    location ~ ^/worker-executions/[0-9a-f-]+/artifact$ {
        client_max_body_size 16m;
        proxy_pass http://api:3101;
    }

    location = /github/webhook {
        proxy_pass http://api:3101;
    }

    location / {
        proxy_pass http://web:3000;
    }
}
