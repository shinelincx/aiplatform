map $http_upgrade $ado_connection_upgrade {
    default upgrade;
    '' close;
}

resolver 127.0.0.11 valid=5s ipv6=off;

upstream ado_api {
    zone ado_api 64k;
    server api:3101 resolve;
}

upstream ado_web {
    zone ado_web 64k;
    server web:3000 resolve;
}

server {
    listen 443 ssl;
    server_name _;
    ssl_certificate /etc/ado-tls/tls.crt;
    ssl_certificate_key /etc/ado-tls/tls.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $ado_connection_upgrade;
    proxy_read_timeout 90s;

    location = /health {
        proxy_pass http://ado_api;
    }

    location = /workers/ws {
        proxy_pass http://ado_api;
    }

    location ~ ^/worker-executions/[0-9a-f-]+/(artifact|revision-artifact)$ {
        client_max_body_size 16m;
        proxy_pass http://ado_api;
    }

    location = /github/webhook {
        proxy_pass http://ado_api;
    }

    location / {
        proxy_pass http://ado_web;
    }
}
