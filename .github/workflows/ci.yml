name: CI
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  compose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - run: docker compose up --build --wait --wait-timeout 240
      - run: docker compose exec -T api env API_BASE_URL=http://api:3101 npm run dev -w @ado/worker
      - run: curl -fsS http://127.0.0.1:3100 | grep -F '连接正常' > /dev/null
      - if: failure()
        run: docker compose logs --no-color --tail 80
      - if: always()
        run: docker compose down
