name: CI
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  compose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      COMPOSE_FILE: compose.yaml:compose.staging.yaml
      ADO_BOOTSTRAP_EMAIL: ci@example.test
      ADO_BOOTSTRAP_PASSWORD: ci-local-password-only
      POSTGRES_PASSWORD: ci-local-database-owner-only
      ADO_DATABASE_PASSWORD: ci-local-database-api-only
      GITHUB_WEBHOOK_SECRET: ci-local-webhook-only
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
      - name: Generate staging TLS fixture
        run: |
          tls_dir="${RUNNER_TEMP}/ado-ci-tls"
          mkdir -m 700 "$tls_dir"
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 -subj /CN=gateway \
            -addext 'subjectAltName=DNS:gateway,DNS:localhost,IP:127.0.0.1' \
            -keyout "$tls_dir/tls.key" -out "$tls_dir/tls.crt"
          echo "ADO_STAGING_TLS_DIR=$tls_dir" >> "$GITHUB_ENV"
          echo "CURL_CA_BUNDLE=$tls_dir/tls.crt" >> "$GITHUB_ENV"
      - name: Build the release image
        run: |
          docker build -t ado-platform-staging:local \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --label "io.ado.git.tree=$(git rev-parse 'HEAD^{tree}')" .
      - run: docker compose up --no-build --wait --wait-timeout 240
      - run: docker compose exec -T api env API_BASE_URL=http://api:3101 npm run dev -w @ado/worker
      - name: Verify HTTPS workbench and WSS Worker
        run: |
          if env -u CURL_CA_BUNDLE bash scripts/probe-staging.sh https://127.0.0.1:3443; then
            echo 'Probe unexpectedly accepted the untrusted staging certificate' >&2
            exit 1
          fi
          bash scripts/probe-staging.sh https://127.0.0.1:3443
          ADO_VERIFY_WEB_URL=https://127.0.0.1:3443 NODE_EXTRA_CA_CERTS="$CURL_CA_BUNDLE" node scripts/verify-projects.mjs
          docker compose cp "$CURL_CA_BUNDLE" api:/tmp/ado-ci-tls.crt
          docker compose exec -T api env NODE_EXTRA_CA_CERTS=/tmp/ado-ci-tls.crt ADO_VERIFY_WORKER_URL=https://gateway \
            node scripts/verify-workers.mjs
          docker compose exec -T -e ADO_VERIFY_MIGRATION_PASSWORD="$POSTGRES_PASSWORD" \
            api env NODE_EXTRA_CA_CERTS=/tmp/ado-ci-tls.crt ADO_VERIFY_WORKER_URL=https://gateway \
            ADO_VERIFY_WEB_URL=https://gateway npm exec -- tsx --tsconfig apps/api/tsconfig.json scripts/verify-executions.mjs
          docker compose exec -T api env NODE_EXTRA_CA_CERTS=/tmp/ado-ci-tls.crt \
            ADO_VERIFY_WEB_URL=https://gateway npm exec -- tsx --tsconfig apps/api/tsconfig.json scripts/verify-agent-planning.mjs
          docker compose exec -T api npm exec -- tsx --tsconfig apps/api/tsconfig.json scripts/verify-database-isolation.mjs
      - name: Verify staging outage detection and recovery
        run: |
          docker compose stop web
          if bash scripts/probe-staging.sh https://127.0.0.1:3443; then
            echo 'Probe unexpectedly passed while the workbench was stopped' >&2
            exit 1
          fi
          docker compose up -d --no-build --no-deps --wait web
          gateway=$(docker compose ps --quiet gateway)
          restarts=$(docker inspect --format '{{.RestartCount}}' "$gateway")
          docker compose exec -T gateway nginx -s stop
          for attempt in {1..20}; do
            if [[ $(docker inspect --format '{{.RestartCount}} {{.State.Health.Status}}' "$gateway") == "$((restarts + 1)) healthy" ]]; then
              bash scripts/probe-staging.sh https://127.0.0.1:3443
              exit 0
            fi
            sleep 2
          done
          echo 'Staging gateway did not restart and become healthy' >&2
          exit 1
      - name: Verify API recovery when PostgreSQL starts later
        run: |
          api=$(docker compose ps --quiet api)
          restarts=$(docker inspect --format '{{.RestartCount}}' "$api")
          docker compose stop postgres
          docker compose restart api
          timeout 30s bash -c '
            while [[ $(docker inspect --format "{{.RestartCount}}" "$1") == "$2" ]]; do sleep 1; done
          ' _ "$api" "$restarts"
          docker compose up -d --no-build --no-deps --wait postgres
          timeout 45s bash -c '
            until bash scripts/probe-staging.sh https://127.0.0.1:3443; do sleep 2; done
          '
      - name: Restore isolated backup
        run: |
          bash scripts/compose-backup.sh backup ado-staging "${RUNNER_TEMP}/ado-snapshot"
          WEB_PORT=23100 API_PORT=23101 POSTGRES_PORT=25432 REDIS_PORT=26379 S3_PORT=29000 ADO_STAGING_PORT=23443 \
            bash scripts/compose-backup.sh restore ado-ci-restore "${RUNNER_TEMP}/ado-snapshot"
          bash scripts/probe-staging.sh https://127.0.0.1:23443
          docker compose -p ado-ci-restore exec -T -e ADO_VERIFY_MIGRATION_PASSWORD="$POSTGRES_PASSWORD" \
            api npm exec -- tsx --tsconfig apps/api/tsconfig.json scripts/verify-recovery.mjs
      - name: Package the verified main release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          mkdir "$RUNNER_TEMP/ado-release"
          cd "$RUNNER_TEMP/ado-release"
          docker tag ado-platform-staging:local "ado-platform-release:$GITHUB_SHA"
          docker save "ado-platform-release:$GITHUB_SHA" | gzip -1 > image.tar.gz
          sha256sum image.tar.gz > SHA256SUMS
      - uses: actions/upload-artifact@v7
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          name: ado-release-${{ github.sha }}
          path: ${{ runner.temp }}/ado-release/
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
      - if: failure()
        run: docker compose logs --no-color --tail 80
      - if: always()
        run: |
          docker compose -p ado-ci-restore down --volumes
          docker compose down
