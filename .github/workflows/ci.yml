name: CI
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  compose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ADO_BOOTSTRAP_EMAIL: ci@example.test
      ADO_BOOTSTRAP_PASSWORD: ci-local-password-only
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
      - run: docker compose up --build --wait --wait-timeout 240
      - run: docker compose exec -T api env API_BASE_URL=http://api:3101 npm run dev -w @ado/worker
      - run: node scripts/verify-projects.mjs
      - run: docker compose exec -T api node scripts/verify-workers.mjs
      - run: docker compose exec -T api node scripts/verify-executions.mjs
      - if: failure()
        run: docker compose logs --no-color --tail 80
      - if: always()
        run: docker compose down
